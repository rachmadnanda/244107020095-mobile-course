name: ci

on: [pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _07_week_7_clean_architecture
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed .
      - run: flutter test
